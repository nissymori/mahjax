<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mahjax</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<!-- The words here are the Japanese; data-en, data-en-title, data-en-label and
     data-en-placeholder hold the English the 言語 menu switches to, data-ko and
     data-ko-* the Korean, and data-zh and data-zh-* the Simplified Chinese. -->

<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="メニュー" data-en-label="Menu" data-ko-label="메뉴" data-zh-label="菜单" aria-expanded="false">☰</button>
  <span class="brand">mahjax</span>
  <span id="status" class="status" role="status"></span>
  <span class="grow"></span>
  <div id="replayTools" class="replay-tools" hidden>
    <label><span data-en="View" data-ko="시점" data-zh="视角">視点</span>
      <select id="viewpoint"></select>
    </label>
    <label><span data-en="Hands" data-ko="손패" data-zh="手牌">手牌</span>
      <select id="showAll">
        <option value="1" data-en="All" data-ko="전원" data-zh="全部">全員</option>
        <option value="0" data-en="Viewpoint only" data-ko="시점 플레이어만" data-zh="仅视角">視点のみ</option>
      </select>
    </label>
  </div>
</header>

<main id="stage" class="stage">
  <div id="table" class="table" hidden>
    <div id="seats"></div>
    <div id="center" class="centre-box"></div>
    <div id="actions" class="actions"></div>
  </div>
  <div id="empty" class="empty server-only">
    <p data-en="Start a game, or open a record." data-ko="대국을 시작하거나 패보를 여세요." data-zh="开始对局，或打开牌谱。">対局を始めるか、牌譜を開いてください。</p>
    <button id="emptyStart" class="primary" data-en="Start a game" data-ko="대국 시작" data-zh="开始对局">対局を始める</button>
  </div>
</main>

<footer id="replayBar" class="replay-bar" hidden>
  <button data-jump="first" class="icon-btn" title="最初へ" data-en-title="First" data-ko-title="처음으로" data-zh-title="跳到开头">|◀</button>
  <button data-jump="prevRound" class="icon-btn" title="前の局へ" data-en-title="Previous round" data-ko-title="이전 국으로" data-zh-title="上一局" data-en="◀◀" data-ko="◀◀" data-zh="◀局">◀局</button>
  <button data-jump="prev" class="icon-btn" title="1手戻す" data-en-title="Back one step" data-ko-title="한 수 뒤로" data-zh-title="后退一步">◀</button>
  <span id="replayLabel" class="replay-label"></span>
  <button data-jump="next" class="icon-btn" title="1手進める" data-en-title="Forward one step" data-ko-title="한 수 앞으로" data-zh-title="前进一步">▶</button>
  <button data-jump="nextRound" class="icon-btn" title="次の局へ" data-en-title="Next round" data-ko-title="다음 국으로" data-zh-title="下一局" data-en="▶▶" data-ko="▶▶" data-zh="局▶">局▶</button>
  <button data-jump="last" class="icon-btn" title="最後へ" data-en-title="Last" data-ko-title="마지막으로" data-zh-title="跳到最后">▶|</button>
  <button id="replayAuto" class="icon-btn auto" title="自動再生" data-en-title="Play automatically" data-ko-title="자동 재생" data-zh-title="自动播放">再生</button>
</footer>

<div id="scrim" class="scrim" hidden></div>

<aside id="drawer" class="drawer" hidden aria-label="メニュー" data-en-label="Menu" data-ko-label="메뉴" data-zh-label="菜单">
  <section class="server-only">
    <h2 data-en="New game" data-ko="새 대국" data-zh="新对局">新規対局</h2>
    <label><span data-en="Rules" data-ko="규칙" data-zh="规则">ルール</span>
      <select id="cfgEnv">
        <option value="red_4p" data-en="Red fives" data-ko="적도라 있음" data-zh="有赤牌">赤あり</option>
        <option value="no_red_4p" data-en="No red fives" data-ko="적도라 없음" data-zh="无赤牌">赤なし</option>
        <option value="red_3p" data-en="3-player, red fives" data-ko="3인 마작 적도라 있음" data-zh="三人麻将 有赤牌">三人麻雀 赤あり</option>
        <option value="no_red_3p" data-en="3-player, no red fives" data-ko="3인 마작 적도라 없음" data-zh="三人麻将 无赤牌">三人麻雀 赤なし</option>
      </select>
    </label>
    <label><span data-en="Length" data-ko="대국 수" data-zh="长度">長さ</span>
      <select id="cfgMode">
        <option value="half" data-en="Half game" data-ko="반장전" data-zh="半庄战">半荘</option>
        <option value="east" data-en="East only" data-ko="동풍전" data-zh="东风战">東風</option>
        <option value="single" data-en="One round" data-ko="단판전" data-zh="单局战">一局</option>
      </select>
    </label>
    <label><span data-en="Opponent" data-ko="상대" data-zh="对手">相手</span>
      <select id="cfgAgent"></select>
    </label>
    <label><span data-en="Your seat" data-ko="내 자리" data-zh="我的座位">自席</span>
      <select id="cfgSeat">
        <option value="random" data-en="Random" data-ko="랜덤" data-zh="随机">ランダム</option>
        <option value="0" data-en="East" data-ko="동" data-zh="东家">東</option>
        <option value="1" data-en="South" data-ko="남" data-zh="南家">南</option>
        <option value="2" data-en="West" data-ko="서" data-zh="西家">西</option>
        <option value="3" data-en="North" data-ko="북" data-zh="北家">北</option>
        <option value="none" data-en="None (agents only)" data-ko="없음 (에이전트끼리)" data-zh="无（仅代理对局）">なし（エージェント同士）</option>
      </select>
    </label>
    <label><span data-en="Seed" data-ko="시드" data-zh="随机种子">シード</span>
      <input id="cfgSeed" type="number" min="0" placeholder="空欄でランダム" data-en-placeholder="Random if empty" data-ko-placeholder="미입력시 랜덤" data-zh-placeholder="留空则随机">
    </label>
    <label><span data-en="Name" data-ko="이름" data-zh="名称">名前</span>
      <input id="cfgName" type="text" value="You">
    </label>
    <label class="check">
      <input id="cfgSave" type="checkbox" checked> <span data-en="Save the record" data-ko="대국 기록 저장" data-zh="保存对局记录">対局記録を保存</span>
    </label>
    <button id="startBtn" class="primary" data-en="Start" data-ko="시작" data-zh="开始">開始</button>
  </section>

  <section>
    <h2 data-en="Settings" data-ko="대국 중 설정" data-zh="对局中设置">対局中の設定</h2>
    <label class="check server-only">
      <input id="optHide" type="checkbox" checked> <span data-en="Hide the opponents' hands" data-ko="상대 패 숨기기" data-zh="隐藏他家手牌">相手の手牌を隠す</span>
    </label>
    <label class="check server-only">
      <input id="optNoCalls" type="checkbox"> <span data-en="No calls" data-ko="울기 없음" data-zh="自动跳过鸣牌">鳴きなし</span>
    </label>
    <label><span data-en="Move delay" data-ko="진행 딜레이" data-zh="行动间隔">手の間隔</span>
      <input id="optDelay" type="range" min="0" max="1600" step="100" value="700">
      <span id="optDelayValue" class="hint">700ms</span>
    </label>
    <label><span data-en="Language" data-ko="언어" data-zh="语言">言語</span>
      <select id="optLang">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="ko">한국어</option>
        <option value="zh">简体中文</option>
      </select>
    </label>
    <button id="endBtn" class="danger server-only" data-en="End the game" data-ko="대국 종료" data-zh="结束对局">対局を終了</button>
  </section>

  <section class="server-only">
    <h2 data-en="Records" data-ko="패보" data-zh="牌谱">牌譜</h2>
    <div id="recordList" class="record-list"></div>
    <button id="refreshRecords" class="ghost" data-en="Reload" data-ko="새로 고침" data-zh="刷新">再読み込み</button>
  </section>
</aside>

<div id="overlay" class="overlay" hidden>
  <div id="resultPanel" class="result" role="dialog" aria-modal="true">
    <h2 id="resultTitle"></h2>
    <div id="resultBody"></div>
    <div class="result-actions">
      <button id="resultNext" class="primary"></button>
    </div>
  </div>
  <div id="finalPanel" class="result" role="dialog" aria-modal="true" hidden>
    <h2 data-en="Final standings" data-ko="최종 결과" data-zh="最终结果">終局</h2>
    <div id="finalBody"></div>
    <div class="result-actions">
      <button id="finalQuit" class="ghost" data-en="Quit" data-ko="종료" data-zh="退出">終了</button>
      <button id="finalAgain" class="primary" data-en="Play again" data-ko="한 판 더" data-zh="再来一局">もう一局</button>
      <button id="finalReplay" data-en="Review" data-ko="복기" data-zh="复盘">解析</button>
    </div>
  </div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
