<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mahjax</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="メニュー" aria-expanded="false">☰</button>
  <span class="brand">mahjax</span>
  <span id="status" class="status" role="status"></span>
  <span class="grow"></span>
  <div id="replayTools" class="replay-tools" hidden>
    <label>視点
      <select id="viewpoint"></select>
    </label>
    <label>手牌
      <select id="showAll">
        <option value="1">全員</option>
        <option value="0">視点のみ</option>
      </select>
    </label>
  </div>
</header>

<main id="stage" class="stage">
  <div id="table" class="table" hidden>
    <div id="seats"></div>
    <div id="center" class="centre-box"></div>
    <div id="actions" class="actions"></div>
  </div>
  <div id="empty" class="empty">
    <p>対局を始めるか、牌譜を開いてください。</p>
    <button id="emptyStart" class="primary">対局を始める</button>
  </div>
</main>

<footer id="replayBar" class="replay-bar" hidden>
  <button data-jump="first" class="icon-btn" title="最初へ">|◀</button>
  <button data-jump="prevRound" class="icon-btn" title="前の局へ">◀局</button>
  <button data-jump="prev" class="icon-btn" title="1手戻す">◀</button>
  <span id="replayLabel" class="replay-label"></span>
  <button data-jump="next" class="icon-btn" title="1手進める">▶</button>
  <button data-jump="nextRound" class="icon-btn" title="次の局へ">局▶</button>
  <button data-jump="last" class="icon-btn" title="最後へ">▶|</button>
  <button id="replayAuto" class="icon-btn auto" title="自動再生">再生</button>
</footer>

<div id="scrim" class="scrim" hidden></div>

<aside id="drawer" class="drawer" hidden aria-label="メニュー">
  <section>
    <h2>新規対局</h2>
    <label>ルール
      <select id="cfgEnv">
        <option value="red_mahjong">赤あり</option>
        <option value="no_red_mahjong">赤なし</option>
      </select>
    </label>
    <label>長さ
      <select id="cfgMode">
        <option value="half">半荘</option>
        <option value="east">東風</option>
        <option value="single">一局</option>
      </select>
    </label>
    <label>相手
      <select id="cfgAgent"></select>
    </label>
    <label>自席
      <select id="cfgSeat">
        <option value="random">ランダム</option>
        <option value="0">東</option>
        <option value="1">南</option>
        <option value="2">西</option>
        <option value="3">北</option>
        <option value="none">なし（エージェント同士）</option>
      </select>
    </label>
    <label>シード
      <input id="cfgSeed" type="number" min="0" placeholder="空欄でランダム">
    </label>
    <label>名前
      <input id="cfgName" type="text" value="You">
    </label>
    <label class="check">
      <input id="cfgSave" type="checkbox" checked> 対局記録を保存
    </label>
    <button id="startBtn" class="primary">開始</button>
  </section>

  <section>
    <h2>対局中の設定</h2>
    <label class="check">
      <input id="optHide" type="checkbox" checked> 相手の手牌を隠す
    </label>
    <label class="check">
      <input id="optNoCalls" type="checkbox"> 鳴きなし
    </label>
    <label>手の間隔
      <input id="optDelay" type="range" min="0" max="1600" step="100" value="700">
      <span id="optDelayValue" class="hint">700ms</span>
    </label>
    <label>言語
      <select id="optLang">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </label>
    <button id="endBtn" class="danger">対局を終了</button>
  </section>

  <section>
    <h2>牌譜</h2>
    <div id="recordList" class="record-list"></div>
    <button id="refreshRecords" class="ghost">再読み込み</button>
  </section>
</aside>

<div id="overlay" class="overlay" hidden>
  <div id="resultPanel" class="result" role="dialog" aria-modal="true">
    <h2 id="resultTitle"></h2>
    <div id="resultBody"></div>
    <div class="result-actions">
      <button id="resultNext" class="primary"></button>
    </div>
  </div>
  <div id="finalPanel" class="result" role="dialog" aria-modal="true" hidden>
    <h2>終局</h2>
    <div id="finalBody"></div>
    <div class="result-actions">
      <button id="finalQuit" class="ghost">終了</button>
      <button id="finalAgain" class="primary">もう一局</button>
      <button id="finalReplay">解析</button>
    </div>
  </div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
