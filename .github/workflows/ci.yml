name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Run Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported Python. They install different
        # JAX releases (3.11 gets no newer than 0.10.2), so both are tested.
        python-version: ["3.11", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install jax jaxlib
          make install
          pip install pytest typing_extensions>=4.2.0

      - name: Run test suite (excluding the UI)
        env:
          PYTHONPATH: .
        run: |
          pytest --ignore=tests/ui -vv

  ui:
    # Its own job, so the UI's full games run beside the main suite rather than after it.
    name: Run UI Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install jax jaxlib
          make install
          pip install pytest

      - name: Run the UI tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ui -vv

  lint:
    # Lint only, with the Ruff pinned in pyproject's lint group; the code is not held to `ruff format`.
    name: Run Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: |
          pip install -U pip
          pip install --group lint

      - name: Run Ruff
        run: |
          ruff check --output-format=github .

  types:
    # What mypy reports follows JAX's type stubs, which change between releases,
    # so JAX is pinned here as well as mypy. It pins only this check: mahjax
    # itself runs on any JAX its Python allows.
    name: Run mypy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy and the dependencies
        run: |
          pip install -U pip
          pip install -e . --group typing "jax==0.12.0.1"

      - name: Run mypy
        run: |
          mypy mahjax

  games:
    # A pull request plays exactly as its base: random games are digested at every step
    # on both trees, with the same JAX (benchmarks/trajectory_digest.py). A pull request
    # that changes play on purpose fails here. Skipped when nothing outside the UI
    # changed under mahjax/.
    if: github.event_name == 'pull_request'
    name: Same games as the base (${{ matrix.setting }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # East games end sooner than half games, so the game end is played too.
        setting: ["red_4p single auto", "red_4p east auto", "red_4p east confirm", "red_3p east auto"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install jax jaxlib typing_extensions

      - name: Digest the games on the base and on the pull request
        run: |
          base=${{ github.event.pull_request.base.sha }}
          if git diff --quiet $base HEAD -- mahjax ':!mahjax/ui'; then
            echo "Nothing outside the UI changed under mahjax/"
            exit 0
          fi
          git worktree add --detach ../base $base
          read -r env mode end <<< "${{ matrix.setting }}"
          args="--env $env --round-mode $mode --round-end $end --seeds 0 --batch 16 --steps 1000"
          args="$args --cache-dir ../jax_cache"
          python -I benchmarks/trajectory_digest.py run base.txt --src ../base $args
          python -I benchmarks/trajectory_digest.py run head.txt --src . $args
          python -I benchmarks/trajectory_digest.py compare base.txt head.txt
